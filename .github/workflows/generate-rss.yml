permissions:
  contents: write

name: Generate RSS

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24   # ← ここを修正！

      - name: Install dependencies
        run: |
          npm install puppeteer
          npm install xmlbuilder2

      - name: Scrape site 1
        run: node scripts/scrape-site1.js

      - name: Scrape site 2
        run: node scripts/scrape-site2.js

      - name: Scrape site 3
        run: node scripts/scrape-site3.js

      - name: Generate RSS site 1
        run: node scripts/generate-rss-site1.js

      - name: Generate RSS site 2
        run: node scripts/generate-rss-site2.js

      - name: Generate RSS site 3
        run: node scripts/generate-rss-site3.js

      - name: Commit & Push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add feed-site1.xml feed-site2.xml feed-site3.xml
          git commit -m "Update RSS feeds" || echo "No changes"
          git push origin HEAD:main
