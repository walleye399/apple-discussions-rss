permissions:
  contents: write

name: Generate RSS

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: |
          npm install puppeteer xmlbuilder2

      - name: Run all site scripts
        run: |
          for file in scripts/*.js; do
            echo "Running $file"
            node "$file"
          done

      - name: Save RSS to docs
        run: |
          mkdir -p docs
          mv feed-site*.xml docs/

          # 既に手動で作った index.html があるなら上書きしない
          if [ ! -f docs/index.html ]; then
            echo "<html><body><h1>RSS Feeds</h1></body></html>" > docs/index.html
          fi

          ls -la docs

      - name: Commit & Push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs
          git commit -m "Update RSS feeds" || echo "No changes"
          git push origin HEAD:main
