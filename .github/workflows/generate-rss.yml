permissions:
  contents: write

name: Generate RSS

on:
  schedule:
    - cron: "0 * * * *"  # 毎時0分（1時間ごと）
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: |
          npm install puppeteer
          npm install xmlbuilder2

      - name: Run scraper
        run: node scripts/scrape.js

      - name: Generate RSS
        run: node scripts/generate-rss.js

      - name: Commit & Push
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add public/feed.xml
          git commit -m "Update RSS" || echo "No changes"
          git push
